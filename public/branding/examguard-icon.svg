<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="ExamGuard">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#0F172A"/>
  <!-- Shield outer -->
  <path d="M16 6.2 L 24.2 10.8 V 17.8 C 24.2 22.2 21.1 26 16 28.2 C 10.9 26 7.8 22.2 7.8 17.8 V 10.8 L 16 6.2 Z" fill="none" stroke="white" stroke-width="1.35" stroke-linejoin="round"/>
  <!-- Inner shield (subtle) -->
  <path d="M16 8.2 L 22.2 11.8 V 17.6 C 22.2 21 19.8 24.2 16 26.1 C 12.2 24.2 9.8 21 9.8 17.6 V 11.8 L 16 8.2 Z" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.18" stroke-width="0.7"/>
  <!-- Academic: subtle graduation cap + check combination -->
  <!-- Cap base -->
  <g opacity="0.98">
    <path d="M16 11.2 L 20.8 13.4 L 16 15.6 L 11.2 13.4 Z" fill="white" fill-opacity="0.95"/>
    <path d="M16 11.2 L 20.8 13.4 L 16 15.6 L 11.2 13.4 Z" fill="none" stroke="white" stroke-width="0.5" stroke-linejoin="round"/>
    <!-- tassel -->
    <path d="M20.8 13.4 V 15.2 C 20.8 15.9 18.6 16.9 16 16.9" fill="none" stroke="white" stroke-width="0.55" stroke-linecap="round" opacity="0.9"/>
    <circle cx="20.8" cy="15.6" r="0.7" fill="white"/>
  </g>
  <!-- Check (prominent) -->
  <path d="M11.6 17.9 L 14.35 20.65 L 20.9 13.9" stroke="white" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
